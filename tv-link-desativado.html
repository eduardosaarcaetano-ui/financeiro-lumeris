<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Link da TV desativado</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #020b08;
        color: #f4faf7;
      }
      main {
        width: min(680px, calc(100% - 40px));
        padding: 40px;
        border: 1px solid #725c16;
        border-radius: 18px;
        background: #111a16;
        text-align: center;
      }
      h1 { margin: 0 0 16px; color: #f4c542; font-size: clamp(28px, 5vw, 48px); }
      p { margin: 8px 0; font-size: clamp(17px, 2vw, 22px); line-height: 1.5; }
      small { display: block; margin-top: 24px; color: #aab8b1; }
    </style>
  </head>
  <body>
    <main>
      <h1>Link antigo da TV desativado</h1>
      <p>Esta tela não consulta o banco de dados nem carrega o ERP.</p>
      <p>Para voltar ao ranking, abra o novo link pelo botão <strong>TV mês</strong> no Rank de Vendas.</p>
      <small>Proteção de consumo ativada em 18/08/2026.</small>
    </main>
  </body>
</html>
